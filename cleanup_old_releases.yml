---
# ==============================================================================
# cleanup_old_releases.yml - Release Retention & Disk Hygiene Playbook
# Keeps the latest N releases and safely purges stale versions without
# touching 'current' or 'previous' pointers.
# ==============================================================================

- name: Purge Obsolete Releases from Fleet
  hosts: all
  gather_facts: false

  vars:
    base_dir: "{{ install_dir | default('/opt/order_service') }}"
    releases_dir: "{{ base_dir }}/releases"
    keep_releases: 2

  tasks:
    # --------------------------------------------------------------------------
    # Task 1: Find all release directories on target
    # --------------------------------------------------------------------------
    - name: Enumerate release directories
      ansible.builtin.find:
        paths: "{{ releases_dir }}"
        file_type: directory
        recurse: false
      register: found_releases

    # --------------------------------------------------------------------------
    # Task 2: Identify targets of 'current' and 'previous' symlinks
    # --------------------------------------------------------------------------
    - name: Read 'current' link target
      ansible.builtin.stat:
        path: "{{ base_dir }}/current"
      register: current_stat

    - name: Read 'previous' link target
      ansible.builtin.stat:
        path: "{{ base_dir }}/previous"
      register: previous_stat

    # --------------------------------------------------------------------------
    # Task 3: Calculate which directories are safe to delete
    # Sort descending by mtime, slice off the top N, and protect active pointers
    # --------------------------------------------------------------------------
    - name: Determine stale releases for purge
      ansible.builtin.set_fact:
        stale_releases: >-
          {{
            (found_releases.files | sort(attribute='mtime', reverse=true) | map(attribute='path') | list)[keep_releases:]
            | default([])
            | reject('equalto', current_stat.stat.lnk_target | default(''))
            | reject('equalto', previous_stat.stat.lnk_target | default(''))
            | list
          }}

    # --------------------------------------------------------------------------
    # Task 4: Remove stale directories
    # --------------------------------------------------------------------------
    - name: Purge expired release directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ stale_releases }}"
      when: stale_releases | length > 0
      become: true

    - name: Report retention status
      ansible.builtin.debug:
        msg: "Cleanup complete on {{ inventory_hostname }}. Retained latest {{ keep_releases }} releases. Purged: {{ stale_releases }}"