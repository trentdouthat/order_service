# ==============================================================================
# Ansible Multi-Node Fleet Inventory
# Deterministic Host Mappings (Backed by /etc/hosts)
# ==============================================================================

[staging]
samsung ansible_host=staging-samsung ansible_user=trentdouthat

[prod]
rpi ansible_host=prod-rpi ansible_user=tdouthat

[all:vars]
ansible_python_interpreter=/usr/bin/python3
install_dir=/opt/order_service
service_name=order-service
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
